# Link checker config for CI (.github/workflows/ci.yml).
# Private, loopback and link-local addresses (tailnet IPs, localhost ports)
# can't be reached from a GitHub runner, so they are skipped, not "fixed".
exclude_private = true
exclude_loopback = true
exclude_link_local = true
include_fragments = false
max_retries = 3
timeout = 20
accept = ["200..=299", "403", "429"]
exclude = [
  # Tailscale MagicDNS names and Cloudflare Access-protected hosts need a login.
  '\.ts\.net',
  'cloudflareaccess\.com',
  # GitHub search/blob anchors are rate-limited for anonymous runners.
  '^https://github\.com/.*/(search|compare)',
]
