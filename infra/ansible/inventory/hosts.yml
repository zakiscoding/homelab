---
# Homelab nodes by their Tailscale addresses (docs/INVENTORY.md). No secrets live here:
# SSH uses Tailscale SSH or the controller's own keys, and the Tailscale auth key comes from the
# TS_AUTHKEY environment variable or a vault file outside the repo.
all:
  children:
    linux:
      children:
        gpu_ubuntu:
          hosts:
            # GPU PC, Ubuntu boot. Offline whenever the PC runs Windows.
            zak-gpu-node:
              ansible_host: 100.121.51.35
              ansible_user: zak
        wsl:
          hosts:
            # Ubuntu in WSL2 on the GPU PC's Windows boot. SSH to zak_pc lands in cmd.exe, which
            # Ansible can't drive, so run ansible-playbook inside the distro against itself.
            zak-pc-wsl:
              ansible_connection: local
    macos:
      hosts:
        # iMac control plane: Colima + homelab-services. See imac.yml for what is managed.
        mos-imac:
          ansible_host: 100.91.113.98
          ansible_user: momo
    # The Windows laptop (hp-laptop, 100.73.132.95) is the controller and is not managed.
