---
- name: Add Tailscale's apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
  register: tailscale_repo

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    # Refresh only when the repository was just added.
    update_cache: "{{ tailscale_repo is changed }}"

- name: Set the tailscaled service state
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: "{{ tailscale_service_enabled }}"
    state: "{{ tailscale_service_enabled | ternary('started', 'stopped') }}"

- name: Read the Tailscale login state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: tailscale_service_enabled

- name: Log in to the tailnet with the auth key
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up', '--auth-key', tailscale_authkey] + tailscale_up_args }}"
  no_log: true
  changed_when: true
  when:
    - tailscale_service_enabled
    - tailscale_authkey | length > 0
    - (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'
