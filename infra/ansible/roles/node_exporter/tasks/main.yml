---
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download the release, verified against its published SHA-256 list
  ansible.builtin.get_url:
    url: "{{ node_exporter_base_url }}/{{ node_exporter_release }}.tar.gz"
    dest: "/tmp/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
    mode: "0644"
  register: node_exporter_download
  when: not ansible_check_mode

- name: Unpack the release under /opt
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_release }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "{{ node_exporter_install_dir }}/node_exporter"
  when: not ansible_check_mode

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Start and enable node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
