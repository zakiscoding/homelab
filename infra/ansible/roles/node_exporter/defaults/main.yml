---
node_exporter_enabled: true
# Same release as the obs-node-exporter container in gpu-systems-lab/observability.
node_exporter_version: "1.9.1"
# Bind to the node's tailnet address (or 127.0.0.1) so the iMac Prometheus can scrape it and
# the LAN can't. Never 0.0.0.0.
node_exporter_listen_address: "127.0.0.1:9100"
node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
node_exporter_install_dir: "/opt/{{ node_exporter_release }}"
